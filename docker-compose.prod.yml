# Production: только бот, БД внешняя (указывается в .env DATABASE_URL)
# Сеть shop-bot_default — общая для ботов на VPS (доступ к shop-bot-db-1)
services:
  bot:
    build: .
    image: leadfunnelbot:latest
    container_name: leadfunnelbot
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - default

networks:
  default:
    external: true
    name: shop-bot_default
